# ============================================================
# GitHub Notifications
# Манифест плагина для Noctalia Shell (v5+)
# ============================================================

# Обязательные метаданные (верхний уровень манифеста)
id = "obloble/github-notifications"
name = "GitHub Notifications"
author = "obloble"
version = "1.1.1"

# plugin_api 22: использует require() модулей (API 22) и замыкания
# в ui.* колбэках (API 9). Остальное — базовые API.
plugin_api = 22
license = "MIT"
icon = "bell"

description = """
GitHub unread notifications in the bar: a bell widget with a counter \
and a panel with the unread list and notification history. Supports \
mark-as-read (single/all) and opening items on github.com. Requires \
a personal access token.
"""
tags = ["bar", "panel", "github", "notifications", "network"]

# ------------------------------------------------------------
# Настройки плагина (читаются через noctalia.getConfig()).
# ------------------------------------------------------------
[[setting]]
key = "github_token"
type = "string"
label_key = "settings.github_token.label"
description_key = "settings.github_token.description"
default = ""

[[setting]]
key = "poll_interval_sec"
type = "int"
label_key = "settings.poll_interval_sec.label"
description_key = "settings.poll_interval_sec.description"
default = 120
min = 60
max = 600

# ------------------------------------------------------------
# Виджет на верхней панели: колокольчик + счётчик непрочитанных.
# Клик открывает панель уведомлений.
# ------------------------------------------------------------
[[widget]]
id = "widget"
entry = "widget.luau"

# ------------------------------------------------------------
# Панель уведомлений: список непрочитанных + история,
# отметка «прочитано» (по одному и все сразу), открытие на github.com.
# ------------------------------------------------------------
[[panel]]
id = "panel"
entry = "panel.luau"
width = 560
height = 640
placement = "attached"
position = "auto"
dismiss_on_outside_click = true
open_near_click = true
